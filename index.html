<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Profile Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: #fff; border-radius: 16px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  p.sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
  label { font-size: 13px; font-weight: 500; color: #555; display: block; margin-bottom: 6px; }
  input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 1.25rem; transition: border 0.2s; }
  input[type="text"]:focus { border-color: #7c6fe0; }
  .video-wrap { border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 1rem; aspect-ratio: 1; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas { display: none; }
  .preview-img { width: 100%; border-radius: 12px; margin-bottom: 1rem; display: none; }
  .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s, opacity 0.2s; margin-bottom: 10px; }
  .btn-primary { background: #7c6fe0; color: #fff; }
  .btn-primary:hover { background: #6a5ec8; }
  .btn-secondary { background: #f0f0ee; color: #444; }
  .btn-secondary:hover { background: #e4e4e0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .divider { border: none; border-top: 1px solid #f0f0ee; margin: 1.25rem 0; }
  /* Signature toggle */
  .sig-toggle { display: flex; gap: 8px; margin-bottom: 1rem; }
  .sig-toggle button { flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid #ddd; background: #fff; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; transition: all 0.2s; }
  .sig-toggle button.active { border-color: #7c6fe0; color: #7c6fe0; background: #f3f1fd; }
  /* Signature draw */
  .sig-pad-wrap { position: relative; margin-bottom: 6px; }
  #signature-pad { border: 1.5px dashed #ccc; border-radius: 10px; background: #fafafa; width: 100%; height: 150px; display: block; touch-action: none; cursor: crosshair; }
  .clear-sig { position: absolute; top: 8px; right: 10px; font-size: 12px; color: #7c6fe0; background: none; border: none; cursor: pointer; }
  /* Signature camera */
  .sig-cam-wrap { border-radius: 12px; overflow: hidden; background: #111; margin-bottom: 1rem; height: 160px; }
  .sig-cam-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sig-preview { width: 100%; border-radius: 10px; margin-bottom: 1rem; display: none; border: 1.5px solid #eee; }
  .sig-tip { font-size: 11px; color: #bbb; margin-bottom: 1rem; }
  .status { text-align: center; font-size: 13px; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .status.success { background: #e6f7ee; color: #1a7a45; display: block; }
  .status.error { background: #fdeaea; color: #a32d2d; display: block; }
  .tip { font-size: 12px; color: #aaa; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h1>📋 Office Profile Form</h1>
  <p class="sub">Fill in all sections to submit your profile.</p>

  <label for="name">Full name</label>
  <input type="text" id="name" placeholder="e.g. Ada Okafor" autocomplete="name" />

  <label for="pf">PF number</label>
  <input type="text" id="pf" placeholder="e.g. PF-00123" />

  <hr class="divider">

  <!-- PROFILE PHOTO -->
  <label>Profile photo</label>
  <div class="video-wrap" id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <canvas id="canvas"></canvas>
  <img id="preview" class="preview-img" alt="Profile photo preview" />
  <button class="btn btn-primary" id="snap-btn" onclick="snapPhoto()">📷 Take photo</button>
  <button class="btn btn-secondary" id="retake-btn" onclick="retake()" style="display:none">↩ Retake photo</button>

  <hr class="divider">

  <!-- SIGNATURE -->
  <label>Signature</label>
  <div class="sig-toggle">
    <button id="tab-draw" class="active" onclick="switchSig('draw')">✏️ Draw signature</button>
    <button id="tab-photo" onclick="switchSig('photo')">📸 Photo of signature</button>
  </div>

  <!-- Draw mode -->
  <div id="sig-draw-section">
    <div class="sig-pad-wrap">
      <canvas id="signature-pad" width="380" height="150"></canvas>
      <button class="clear-sig" onclick="clearSignature()">Clear</button>
    </div>
    <p class="sig-tip">Draw your signature above using your finger or mouse</p>
  </div>

  <!-- Photo mode -->
  <div id="sig-photo-section" style="display:none">
    <div class="sig-cam-wrap" id="sig-cam-wrap">
      <video id="sig-video" autoplay playsinline muted></video>
    </div>
    <canvas id="sig-canvas"></canvas>
    <img id="sig-preview" class="sig-preview" alt="Signature photo preview" />
    <p class="sig-tip">Place your signed paper in front of the camera and snap it</p>
    <button class="btn btn-primary" id="sig-snap-btn" onclick="snapSignature()">📷 Snap signature</button>
    <button class="btn btn-secondary" id="sig-retake-btn" onclick="retakeSignature()" style="display:none">↩ Retake</button>
  </div>

  <hr class="divider">

  <button class="btn btn-primary" id="submit-btn" onclick="submitForm()" disabled>✅ Submit profile</button>
  <div class="status" id="status"></div>
  <p class="tip">Your data is saved securely to our team's Google Drive.</p>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz823-10GAgM6RtYIk6XhFZNy6juQ9_2dECGN__vgLdpXRG1KgvF69k2nMyy9SJO7Yz/exec";

  // ── Profile photo ──
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  let capturedImage = null;
  let sigMode = 'draw';
  let capturedSignature = null;
  let hasSigned = false;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(s => video.srcObject = s)
    .catch(() => showStatus('Camera access denied. Please allow and reload.', 'error'));

  function snapPhoto() {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    capturedImage = canvas.toDataURL('image/jpeg', 0.85);
    preview.src = capturedImage; preview.style.display = 'block';
    document.getElementById('video-wrap').style.display = 'none';
    document.getElementById('snap-btn').style.display = 'none';
    document.getElementById('retake-btn').style.display = 'block';
    checkReady();
  }

  function retake() {
    capturedImage = null;
    preview.style.display = 'none';
    document.getElementById('video-wrap').style.display = 'block';
    document.getElementById('snap-btn').style.display = 'block';
    document.getElementById('retake-btn').style.display = 'none';
    checkReady();
  }

  // ── Signature toggle ──
  let sigStream = null;
  function switchSig(mode) {
    sigMode = mode;
    document.getElementById('tab-draw').classList.toggle('active', mode === 'draw');
    document.getElementById('tab-photo').classList.toggle('active', mode === 'photo');
    document.getElementById('sig-draw-section').style.display = mode === 'draw' ? 'block' : 'none';
    document.getElementById('sig-photo-section').style.display = mode === 'photo' ? 'block' : 'none';
    capturedSignature = null; hasSigned = false;
    if (mode === 'photo' && !sigStream) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
        .then(s => { sigStream = s; document.getElementById('sig-video').srcObject = s; })
        .catch(() => showStatus('Could not access rear camera.', 'error'));
    }
    checkReady();
  }

  // ── Signature draw ──
  const sigPad = document.getElementById('signature-pad');
  const sigCtx = sigPad.getContext('2d');
  sigCtx.strokeStyle = '#1a1a1a'; sigCtx.lineWidth = 2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  let isSigning = false;

  function getPos(e) {
    const rect = sigPad.getBoundingClientRect();
    const sx = sigPad.width / rect.width, sy = sigPad.height / rect.height;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
  }
  sigPad.addEventListener('mousedown', e => { isSigning = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); });
  sigPad.addEventListener('mousemove', e => { if (!isSigning) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); hasSigned = true; checkReady(); });
  sigPad.addEventListener('mouseup', () => isSigning = false);
  sigPad.addEventListener('mouseleave', () => isSigning = false);
  sigPad.addEventListener('touchstart', e => { e.preventDefault(); isSigning = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }, { passive: false });
  sigPad.addEventListener('touchmove', e => { e.preventDefault(); if (!isSigning) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); hasSigned = true; checkReady(); }, { passive: false });
  sigPad.addEventListener('touchend', () => isSigning = false);

  function clearSignature() { sigCtx.clearRect(0, 0, sigPad.width, sigPad.height); hasSigned = false; checkReady(); }

  // ── Signature photo ──
  const sigVideo = document.getElementById('sig-video');
  const sigCanvas = document.getElementById('sig-canvas');
  const sigPreview = document.getElementById('sig-preview');

  function snapSignature() {
    sigCanvas.width = sigVideo.videoWidth; sigCanvas.height = sigVideo.videoHeight;
    sigCanvas.getContext('2d').drawImage(sigVideo, 0, 0);
    capturedSignature = sigCanvas.toDataURL('image/jpeg', 0.85);
    sigPreview.src = capturedSignature; sigPreview.style.display = 'block';
    document.getElementById('sig-cam-wrap').style.display = 'none';
    document.getElementById('sig-snap-btn').style.display = 'none';
    document.getElementById('sig-retake-btn').style.display = 'block';
    hasSigned = true; checkReady();
  }

  function retakeSignature() {
    capturedSignature = null; hasSigned = false;
    sigPreview.style.display = 'none';
    document.getElementById('sig-cam-wrap').style.display = 'block';
    document.getElementById('sig-snap-btn').style.display = 'block';
    document.getElementById('sig-retake-btn').style.display = 'none';
    checkReady();
  }

  function checkReady() {
    document.getElementById('submit-btn').disabled = !(capturedImage && hasSigned);
  }

  // ── Submit ──
  async function submitForm() {
    const name = document.getElementById('name').value.trim();
    const pf = document.getElementById('pf').value.trim();
    if (!name) { showStatus('Please enter your full name.', 'error'); return; }
    if (!pf) { showStatus('Please enter your PF number.', 'error'); return; }
    if (!capturedImage) { showStatus('Please take your profile photo.', 'error'); return; }
    if (!hasSigned) { showStatus('Please provide your signature.', 'error'); return; }

    const sigData = sigMode === 'draw' ? sigPad.toDataURL('image/png') : capturedSignature;
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Uploading...';

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        body: JSON.stringify({ name, pf, image: capturedImage, signature: sigData }),
        headers: { 'Content-Type': 'application/json' }
      });
      showStatus('✅ Submitted successfully! Thank you, ' + name + '.', 'success');
      btn.style.display = 'none';
      document.getElementById('retake-btn').style.display = 'none';
    } catch (err) {
      showStatus('Upload failed: ' + err.message, 'error');
      btn.disabled = false; btn.textContent = '✅ Submit profile';
    }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = 'status ' + type;
  }
</script>
</body>
</html>
